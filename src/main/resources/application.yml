spring:
  application:
    name: estoque-reserva
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/estoque}
    username: ${DB_USER:estoque}
    password: ${DB_PASSWORD:estoque}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

reserva:
  ttl-minutos: ${RESERVA_TTL_MINUTOS:15}
  expiracao:
    intervalo-ms: ${RESERVA_EXPIRACAO_INTERVALO_MS:60000}
